<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Structure Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The structure ladder: from the empty set to a Riemannian manifold, one layer of structure per rung. */
:root{--bg:#0e0618;--ink:#e8e4f4;--dim:#9a93b8;--gold:#f5c451;--teal:#3fd0c9;--pink:#ff7ac8;--blue:#7aa8ff;--green:#57e08a;--violet:#b48cff;--red:#ff6b5a;--line:rgba(255,255,255,.1);}
*{box-sizing:border-box}
html{background:#0e0618}
html,body{margin:0;background-color:#0e0618;color:var(--ink);font-family:'Spectral',Georgia,serif}
body{padding:14px 16px 28px;background:radial-gradient(120% 60% at 50% 0%,#2a0f45,#0e0618 70%) no-repeat,#0e0618}
h1{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:600;margin:0 0 2px}
h1 em{font-style:italic;color:var(--dim);font-weight:400}
.sub{font-size:13px;color:var(--dim);margin:0 0 10px}
.rungs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.rung{font:500 10.5px 'IBM Plex Mono',monospace;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.035);cursor:pointer;white-space:nowrap;transition:all .2s}
.rung:hover{border-color:rgba(245,196,81,.5);color:var(--ink)}
.rung.done{color:#cfc9e4;border-color:rgba(245,196,81,.25)}
.rung.on{border-color:var(--gold);color:#120b18;background:var(--gold)}
.rung.milestone{box-shadow:inset 0 0 0 1px rgba(127,227,214,.35)}
.stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(10,6,20,.45)}
.ctl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);min-height:40px}
.ctl:empty{display:none}
.ctl .lab{font:10.5px 'IBM Plex Mono',monospace;color:var(--dim);margin:0 2px 0 6px}
.b{font:500 10.5px 'IBM Plex Mono',monospace;padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:#cfc9e4;background:rgba(255,255,255,.04);cursor:pointer}
.b:hover{border-color:var(--gold)}
.b.on{border-color:var(--gold);color:#fff;background:rgba(245,196,81,.16)}
.b.set{border-radius:7px;min-width:62px;text-align:center}
.b.set.on{border-color:var(--teal);background:rgba(63,208,201,.18)}
.ctl input[type=range]{accent-color:var(--gold);width:130px;vertical-align:middle}
#cv{display:block;width:100%;height:400px;touch-action:none;cursor:crosshair}
.read{font:11.5px/1.65 'IBM Plex Mono',monospace;color:#cfc9e4;padding:8px 12px;border-top:1px solid var(--line);min-height:40px;white-space:pre-wrap}
.read .g{color:var(--gold);font-weight:500}.read .t{color:var(--teal);font-weight:500}.read .r{color:var(--red);font-weight:500}.read .d{color:#8d86a8}
.card{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,rgba(40,18,70,.45),rgba(14,6,24,.4));animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.card h2{font-family:'Fraunces',Georgia,serif;font-size:21px;margin:3px 0 6px;line-height:1.2}
.lead{font-size:15px;line-height:1.55;margin:0 0 12px;color:#e2ddf2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{border-left:2px solid var(--gold);padding:4px 0 4px 12px}
.box.def{grid-column:1/-1;border-color:var(--teal);background:rgba(63,208,201,.05);padding:9px 12px;border-radius:0 10px 10px 0}
.box h3{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin:0 0 5px;color:var(--gold)}
.box.def h3{color:var(--teal)}
.box p,.box li{font-size:14px;line-height:1.55;margin:0 0 6px;color:#d9d3ec}
.box ul{margin:0;padding-left:18px}
.box b,.gloss b{color:#fff}
.m{font-family:'IBM Plex Mono',monospace;font-size:.88em;color:#ffe9a8}
.no{color:#ff9d8f}.yes{color:#8ff0c0}
.nav{display:flex;gap:8px;margin-top:12px}
.nbtn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:600 13px 'Spectral',serif;cursor:pointer}
.nbtn.primary{background:rgba(245,196,81,.16);border-color:var(--gold);color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:default}
.gloss{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.gloss h2{font-family:'Fraunces',Georgia,serif;font-size:17px;margin:0 0 4px}
.gloss .sub{margin-bottom:8px}
.gloss section{margin:0 0 10px}
.gloss section h4{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 4px;cursor:pointer}
.gloss dl{margin:0;display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:3px 12px}
.gloss dt{font:600 13px 'Spectral',serif;color:#fff}
.gloss dd{margin:0;font-size:13px;line-height:1.5;color:#cfc9e4}
.gloss section.cur h4{color:var(--teal)}
.chain{font:11px 'IBM Plex Mono',monospace;color:var(--dim);margin:6px 0 0;line-height:1.7}
.chain b{color:var(--gold);font-weight:500}
</style>
</head>
<body>
<h1>The Structure Ladder <em>— from nothing to curved space, one layer at a time</em></h1>
<p class="sub">Each rung adds exactly one piece of structure, says precisely what was added, and shows what you can suddenly ask. Everything defined so far is collected at the bottom.</p>
<div class="rungs" id="rungs"></div>
<div class="stage">
  <div class="ctl" id="ctl"></div>
  <canvas id="cv"></canvas>
  <div class="read" id="read"></div>
</div>
<div id="card"></div>
<div class="nav"><button class="nbtn" id="prev">← previous rung</button><button class="nbtn primary" id="next">add the next structure →</button></div>
<div class="gloss" id="gloss"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const COL = { ink:"#e8e4f4", dim:"#9a93b8", gold:"#f5c451", teal:"#3fd0c9", pink:"#ff7ac8", blue:"#7aa8ff", green:"#57e08a", violet:"#b48cff", red:"#ff6b5a" };
const cv = $("#cv"), ctx = cv.getContext("2d");
let W = 600, H = 400, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth || 600; H = cv.clientHeight || 400; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize); if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = t => t * t * (3 - 2 * t);
const read = h => { $("#read").innerHTML = h; };

/* ---------- drawing kit ---------- */
function dot(x, y, r, c, glow) { if (glow) { ctx.shadowColor = c; ctx.shadowBlur = glow; } ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0; }
function text(s, x, y, c, size, align, font) { ctx.font = `${font || ""}${size || 12}px "IBM Plex Mono", monospace`; ctx.fillStyle = c; ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; }
function serif(s, x, y, c, size, align) { ctx.font = `600 ${size || 16}px Fraunces, Georgia, serif`; ctx.fillStyle = c; ctx.textAlign = align || "left"; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; }
function line(x1, y1, x2, y2, c, w, dash) { ctx.strokeStyle = c; ctx.lineWidth = w || 1; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]); }
function arrow(x1, y1, x2, y2, c, w, head) { line(x1, y1, x2, y2, c, w); const a = Math.atan2(y2 - y1, x2 - x1), h = head || 9; ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - h * Math.cos(a - .42), y2 - h * Math.sin(a - .42)); ctx.lineTo(x2 - h * Math.cos(a + .42), y2 - h * Math.sin(a + .42)); ctx.closePath(); ctx.fill(); }
function poly(P, fill, stroke, w, dash) { ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w || 1; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); } }
function curve(P, stroke, w, dash) { ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.strokeStyle = stroke; ctx.lineWidth = w || 1; if (dash) ctx.setLineDash(dash); ctx.stroke(); ctx.setLineDash([]); }
function panelTitle(s, x, y) { text(s, x, y, "rgba(207,201,228,.7)", 10.5); }
// the pad-neighbourhood of the convex hull of some points: a smooth blob that contains exactly those points
function hullOf(P) { const pts = P.slice().sort((a, b) => a.x - b.x || a.y - b.y); if (pts.length < 3) return pts; const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); } up.pop(); lo.pop(); return lo.concat(up); }
function blob(P, pad) {
  const h = hullOf(P); ctx.beginPath(); if (!h.length) return;
  if (h.length === 1) { ctx.arc(h[0].x, h[0].y, pad, 0, TAU); return; }
  if (h.length === 2) { const [a, b] = h, t = Math.atan2(b.y - a.y, b.x - a.x); ctx.arc(b.x, b.y, pad, t - Math.PI / 2, t + Math.PI / 2); ctx.arc(a.x, a.y, pad, t + Math.PI / 2, t + 1.5 * Math.PI); ctx.closePath(); return; }
  const n = h.length, cx = h.reduce((s, p) => s + p.x, 0) / n, cy = h.reduce((s, p) => s + p.y, 0) / n;
  const nr = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1; let nx = dy / l, ny = -dx / l; if (nx * ((a.x + b.x) / 2 - cx) + ny * ((a.y + b.y) / 2 - cy) < 0) { nx = -nx; ny = -ny; } return Math.atan2(ny, nx); };
  for (let i = 0; i < n; i++) { const a = h[(i - 1 + n) % n], b = h[i], c = h[(i + 1) % n], a0 = nr(a, b); let d = nr(b, c) - a0; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; ctx.arc(b.x, b.y, pad, a0, a0 + d, d < 0); }
  ctx.closePath();
}
// a smooth closed region used as "an open set U" in the plane rungs
function region(cx, cy, R) { const f = th => R * (1 + .16 * Math.sin(3 * th + .4) + .09 * Math.cos(5 * th - 1)); const P = []; for (let i = 0; i <= 240; i++) { const th = TAU * i / 240; P.push([cx + f(th) * Math.cos(th), cy + f(th) * Math.sin(th)]); }
  return { P, inside: (x, y) => Math.hypot(x - cx, y - cy) < f(Math.atan2(y - cy, x - cx)), dist: (x, y) => Math.min(...P.map(p => Math.hypot(p[0] - x, p[1] - y))) }; }

/* ---------- the shared set of points (rungs 1 and 2) ---------- */
const LET = "abcdefghijklmnopqrstuvwxyz";
const rnd = mulberry(7);
let PTS = [], spawn = 0;
const place = () => ({ x: .08 + .84 * rnd(), y: .1 + .8 * rnd() });
function addPoint() { if (PTS.length >= 26) return; const q = place(); PTS.push({ name: LET[PTS.length], x: q.x, y: q.y, tx: q.x, ty: q.y, born: performance.now() }); }
function stepPoints() { for (const p of PTS) { p.x += (p.tx - p.x) * .12; p.y += (p.ty - p.y) * .12; } }
const SP = p => [20 + p.x * (W - 40), 16 + p.y * (H - 32)];
function drawPoint(p, t, c, label) { const [x, y] = SP(p), age = (t - p.born) / 350, r = 5.5 * clamp(age, 0, 1);
  if (age < 2.5) { ctx.strokeStyle = `rgba(245,196,81,${.6 * (1 - age / 2.5)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 6 + 26 * age / 2.5, 0, TAU); ctx.stroke(); }
  dot(x, y, r, c || COL.ink, 10); if (label !== false) text(p.name, x + 9, y - 8, "#ffe9a8", 12); }
const setName = S => S.length ? "{" + S.join(", ") + "}" : "∅";

/* ================================================================ THE RUNGS */
const RUNGS = [];

/* ---------------------------------------------------------------- 0 · nothing */
RUNGS.push({
  chip: "0 · nothing", kick: "Rung 0 · before any structure", title: "Nothing at all — the empty set",
  lead: "Start with no points, no space, no shape. Mathematics still has one object here: the set with no elements.",
  def: `<p>A <b>set</b> is a collection of objects, its <b>elements</b>; <span class="m">x ∈ X</span> means "x is an element of X". Two sets are equal exactly when they have the same elements (<b>extensionality</b>).</p>
    <p>The <b>empty set</b> <span class="m">∅</span> is the set with no elements. Its existence is an axiom of set theory (Zermelo–Fraenkel), and by extensionality there is only one.</p>`,
  ask: `<p>Nothing: there are no points to ask about. The only fact is <span class="m">|∅| = 0</span>.</p>`,
  ex: `<p>All the spaces in this ladder — the plane, the sphere, curved space-time — are built out of sets. From ∅ alone set theory builds the numbers: <span class="m">0 = ∅, 1 = {∅}, 2 = {∅, {∅}}, …</span> (von Neumann, 1923).</p>`,
  gloss: [["set", "a collection of distinct objects, its elements; x ∈ X means x is an element of X"], ["extensionality", "two sets are equal exactly when they have the same elements"], ["empty set ∅", "the unique set with no elements"]],
  enter() { read(`X = ∅      |X| = 0      <span class="d">press "add the next structure" to create points</span>`); },
  draw(t) { const a = .35 + .15 * Math.sin(t / 900); ctx.save(); ctx.shadowColor = COL.violet; ctx.shadowBlur = 40; serif("∅", W / 2, H / 2 - 6, `rgba(180,140,255,${a})`, 150, "center"); ctx.restore(); text("the empty set: no elements, no structure", W / 2, H - 28, "rgba(207,201,228,.55)", 11, "center"); }
});

/* ---------------------------------------------------------------- 1 · a set */
let shuffleMsg = 0;
RUNGS.push({
  chip: "1 · a set of points", kick: "Rung 1 · add elements", title: "A set of points — and nothing else",
  lead: "Points appear one at a time. That is all there is: a list of distinct elements. Where each dot sits on the screen is only for drawing — press “shuffle the picture” and the set does not change at all.",
  def: `<p>A <b>set</b> X is determined entirely by which elements it has. The only questions it answers are <b>membership</b> (<span class="m">x ∈ X</span>?) and <b>equality</b> (<span class="m">x = y</span>?).</p>
    <p>A <b>function</b> <span class="m">f : X → Y</span> assigns to each x ∈ X exactly one f(x) ∈ Y. A <b>bijection</b> is a function that is one-to-one and onto. Two sets have the same <b>cardinality</b> <span class="m">|X| = |Y|</span> when there is a bijection between them — and as sets they are then indistinguishable.</p>`,
  ask: `<ul><li class="yes">Is x in X? Are x and y the same point?</li><li class="yes">How many points are there? (|X|)</li><li class="no">Not yet: which points are close to each other, whether a sequence of points converges, what shape X has. Distance on the screen is not part of the set.</li></ul>`,
  ex: `<p>{a, b, c} and {1, 2, 3} are different sets with the same cardinality, 3. The natural numbers and the even numbers have the same (infinite) cardinality, via n ↦ 2n; the real numbers have more (Cantor, 1874).</p>`,
  gloss: [["element / membership", "x ∈ X: x belongs to X — the only relation a bare set has"], ["function f : X → Y", "a rule assigning to each x ∈ X exactly one f(x) ∈ Y"], ["bijection", "a one-to-one and onto function; it has an inverse"], ["cardinality |X|", "the size of X; |X| = |Y| when a bijection X → Y exists"]],
  controls: `<button class="b" data-a="add">+ add a point</button><button class="b" data-a="del">− remove one</button><button class="b" data-a="shuffle">⤮ shuffle the picture</button>`,
  wire(c) { c.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const a = b.dataset.a; if (a === "add") addPoint(); if (a === "del") PTS.pop(); if (a === "shuffle") { PTS.forEach(p => { const q = place(); p.tx = q.x; p.ty = q.y; }); shuffleMsg = performance.now(); } this.info(); }); },
  enter() { if (PTS.length < 3) { PTS = []; spawn = 10; } this.info(); },
  info() { read(`X = ${setName(PTS.map(p => p.name))}      |X| = <span class="g">${PTS.length}</span>\n<span class="d">the dots' positions are not part of X — shuffling gives the same set</span>`); },
  draw(t) {
    if (spawn > 0 && (!this._last || t - this._last > 260)) { this._last = t; addPoint(); spawn--; this.info(); }
    stepPoints(); PTS.forEach(p => drawPoint(p, t));
    if (t - shuffleMsg < 2600) serif("same set — the picture changed, the set didn't", W / 2, 22, `rgba(245,196,81,${1 - (t - shuffleMsg) / 2600})`, 15, "center");
  }
});

/* ---------------------------------------------------------------- 2 · subsets, relations, functions */
let relMode = "subset", relSeed = 1, saved = null;
const CLS = [COL.gold, COL.teal, COL.pink, COL.blue, COL.green];
RUNGS.push({
  chip: "2 · relations", kick: "Rung 2 · add subsets and relations", title: "Subsets, relations, equivalence classes, functions",
  lead: "Still no geometry — but now we can single out collections of points (subsets), connect points by a relation, group them into classes, and map one set to another. These are the tools every later rung is built with.",
  def: `<p>A <b>subset</b> <span class="m">A ⊆ X</span> is a set whose elements all lie in X. The <b>power set</b> <span class="m">𝒫(X)</span> is the set of all subsets; if |X| = n it has 2ⁿ elements.</p>
    <p>The <b>Cartesian product</b> <span class="m">X × Y</span> is the set of ordered pairs (x, y). A <b>relation</b> from X to Y is any subset <span class="m">R ⊆ X × Y</span>; write x R y when (x, y) ∈ R. A function is a relation in which every x is related to exactly one y.</p>
    <p>An <b>equivalence relation</b> ~ on X is reflexive (x ~ x), symmetric (x ~ y ⇒ y ~ x) and transitive (x ~ y and y ~ z ⇒ x ~ z). It splits X into disjoint <b>equivalence classes</b> [x] — a <b>partition</b> — and the set of classes is the <b>quotient set</b> <span class="m">X/~</span>.</p>`,
  ask: `<ul><li class="yes">Is A contained in B? Which points are related? Which class is x in? Is f one-to-one, onto?</li><li class="no">Still not: "x is <i>near</i> y". A relation can say which pairs are linked, but a limit needs nearness at every scale at once — closer, and closer, and closer. That is exactly what a topology will provide.</li></ul>`,
  ex: `<p>"Has the same remainder mod 3" is an equivalence relation on the integers with three classes. Gluing is an equivalence relation too: a circle is the interval [0, 1] with 0 ~ 1 — a quotient we will meet again (the line with two origins, the Möbius band, tangent vectors are all built as quotients).</p>`,
  gloss: [["subset A ⊆ X", "every element of A is an element of X"], ["power set 𝒫(X)", "the set of all subsets of X (2ⁿ of them if |X| = n)"], ["Cartesian product X × Y", "the set of ordered pairs (x, y) with x ∈ X, y ∈ Y"], ["relation", "a subset R ⊆ X × Y; x R y means (x, y) ∈ R"], ["equivalence relation", "a relation that is reflexive, symmetric and transitive"], ["equivalence class, quotient X/~", "[x] = {y : y ~ x}; the classes partition X and form the quotient set X/~"]],
  controls: `<span class="lab">show</span><button class="b on" data-m="subset">a subset</button><button class="b" data-m="relation">a relation</button><button class="b" data-m="equiv">an equivalence relation</button><button class="b" data-m="function">a function</button><button class="b" data-a="again">↻ another</button>`,
  wire(c) { c.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { c.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("on", x === b)); this.mode(b.dataset.m); }); c.querySelector("[data-a=again]").onclick = () => { relSeed++; this.mode(relMode); }; },
  enter() { while (PTS.length < 9) addPoint(); PTS.forEach(p => p.born = -1e9); this.mode("subset"); },
  leave() { if (saved) { PTS.forEach((p, i) => { p.tx = saved[i][0]; p.ty = saved[i][1]; }); saved = null; } },
  mode(m) {
    if (saved && m !== "function") { PTS.forEach((p, i) => { p.tx = saved[i][0]; p.ty = saved[i][1]; }); saved = null; }
    relMode = m; const R = mulberry(relSeed * 97 + m.length), n = PTS.length, names = PTS.map(p => p.name);
    if (m === "subset") { this.S = PTS.map(() => R() < .45); if (!this.S.some(Boolean)) this.S[0] = true; const A = names.filter((_, i) => this.S[i]); read(`A = ${setName(A)} ⊆ X      |A| = ${A.length}\n<span class="d">X has 2^${n} = ${2 ** n} subsets in all — the power set 𝒫(X)</span>`); }

      const tri = [...slerp(N, E1, 40), ...slerp(E1, E2, 40), ...slerp(E2, N, 40)].map(P); poly(tri, "rgba(245,196,81,.2)", COL.gold, 2.5);
      const eq = []; for (let i = 0; i <= 120; i++) eq.push(P([Math.sin(TAU * i / 120), 0, Math.cos(TAU * i / 120)])); curve(eq.filter(v => v[2] > -.05), "rgba(232,228,244,.25)", 1);
      [[N, "N"], [E1, "A"], [E2, "B"]].forEach(([v, n]) => { const p = P(v); dot(p[0], p[1], 5, COL.teal, 8); text(n, p[0] + 8, p[1] - 8, COL.teal, 12); });
      const sum = Math.PI + lune; read(`angles: at A 90°, at B 90°, at N ${deg(lune)}   sum = <span class="g">${deg(sum)}</span> > 180°\narea by Gauss–Bonnet = sum − π = <span class="g">${lune.toFixed(3)}</span> (with K = +1) — the triangle is ${(lune / (4 * Math.PI) * 100).toFixed(1)}% of the sphere's area 4π`);
      text("a triangle with two right angles on the equator", W * .72, H / 2, "rgba(207,201,228,.7)", 11, "center"); return;
    }
    const F = hframe(), { X, Y } = F, V = [r12.A, r12.B, r12.C], flat = r12.mode === "flat";
    ctx.fillStyle = "rgba(122,168,255,.04)"; ctx.fillRect(0, 0, W, Y(0)); line(0, Y(0), W, Y(0), "rgba(232,228,244,.5)", 1.5);
    const sides = [[0, 1], [1, 2], [2, 0]].map(([i, j]) => flat ? [V[i], V[j]] : hypArc(V[i], V[j], 120)), all = sides.flat();
    poly(all.map(v => [X(v[0]), Y(v[1])]), "rgba(245,196,81,.15)", COL.gold, 2.6);
    let sum = 0; const names = ["A", "B", "C"];
    V.forEach((v, i) => { const a = V[(i + 1) % 3], b = V[(i + 2) % 3], t1 = flat ? [a[0] - v[0], a[1] - v[1]] : tanAt(v, a), t2 = flat ? [b[0] - v[0], b[1] - v[1]] : tanAt(v, b);
      const ang = Math.acos(clamp((t1[0] * t2[0] + t1[1] * t2[1]) / (Math.hypot(...t1) * Math.hypot(...t2)), -1, 1)); sum += ang;
      const a1 = Math.atan2(-t1[1], t1[0]), a2 = Math.atan2(-t2[1], t2[0]); let d = a2 - a1; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      ctx.strokeStyle = COL.teal; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(X(v[0]), Y(v[1]), 22, a1, a1 + d, d < 0); ctx.stroke();
      dot(X(v[0]), Y(v[1]), 7, COL.teal, 10); text(`${names[i]} ${deg(ang)}`, X(v[0]) + 10, Y(v[1]) - 14, "#e8e4f4", 12); });
    read(flat ? `angle sum = <span class="g">${deg(sum)}</span> — always exactly 180° in the flat plane (K = 0)` : `angle sum = <span class="g">${deg(sum)}</span> < 180°\narea by Gauss–Bonnet with K = −1: π − (α + β + γ) = <span class="g">${(Math.PI - sum).toFixed(4)}</span>   <span class="d">— make the triangle huge and the area still stays below π</span>`);
  }
}, hdrag(r12, ["A", "B", "C"])));

/* ---------------------------------------------------------------- 13 · orientation & volume */
RUNGS.push({
  chip: "13 · orientation & volume", kick: "Rung 13 · the top of the ladder", title: "Orientation and volume: integrating over the whole space",
  lead: "Last, choose a consistent sense of rotation (clockwise vs anticlockwise) at every point. Carry a little oriented frame around a band: on a cylinder it comes back as it left; on a Möbius band it comes back mirrored — no consistent choice exists. On an oriented Riemannian manifold the metric then gives a volume form, and we can integrate.",
  def: `<p>An atlas is <b>oriented</b> if all its transition maps have positive Jacobian determinant <span class="m">det D(φ_β ∘ φ_α⁻¹) > 0</span>; M is <b>orientable</b> if it has one. Equivalently, a basis of each T_pM can be declared "right-handed" continuously in p.</p>
    <p>On an oriented Riemannian n-manifold the <b>volume form</b> is <span class="m">dV = √det(g_ij) dx¹ ∧ … ∧ dxⁿ</span> in any oriented chart. It lets us <b>integrate</b> functions, <span class="m">∫_M f dV</span>, and <b>Stokes' theorem</b> <span class="m">∫_M dω = ∫_∂M ω</span> unifies the fundamental theorem of calculus, Green, Gauss and Stokes.</p>`,
  ask: `<ul><li class="yes">Volume of M, averages, total curvature (Gauss–Bonnet: ∫ K dA = 2πχ for a closed surface), flux, integrals of differential forms.</li></ul>`,
  ex: `<p><span class="yes">Orientable</span>: the plane, the sphere, the torus. <span class="no">Non-orientable</span>: the Möbius band, the Klein bottle, the real projective plane. The area of the hyperbolic triangle in rung 12 is the integral of dA = dx dy / y² over it.</p>`,
  gloss: [["orientation", "a consistent choice of handedness: an atlas whose transition maps have positive Jacobian"], ["orientable / non-orientable", "whether such a choice exists (the Möbius band: no)"], ["volume form dV", "√det g dx¹∧…∧dxⁿ, defined on an oriented Riemannian manifold"], ["integral ∫_M f dV", "the total of f over M, measured with the volume form"], ["Stokes' theorem", "∫_M dω = ∫_∂M ω"]],
  enter() { },
  draw(t) {
    const bw = Math.min(W * .38, 360), bh = Math.min(H * .34, 130), y0 = H * .22, s = (t / 5200) % 2;
    [[W * .27, "cylinder: ends glued the same way", false], [W * .73, "Möbius band: ends glued with a flip", true]].forEach(([cx, title, flip]) => {
      const x0 = cx - bw / 2; ctx.fillStyle = flip ? "rgba(255,122,200,.08)" : "rgba(63,208,201,.08)"; ctx.fillRect(x0, y0, bw, bh); line(x0, y0, x0 + bw, y0, "rgba(232,228,244,.5)"); line(x0, y0 + bh, x0 + bw, y0 + bh, "rgba(232,228,244,.5)");
      arrow(x0, y0 + bh - 6, x0, y0 + 10, flip ? COL.pink : COL.teal, 2.5); arrow(x0 + bw, flip ? y0 + 10 : y0 + bh - 6, x0 + bw, flip ? y0 + bh - 6 : y0 + 10, flip ? COL.pink : COL.teal, 2.5);
      text(title, cx, y0 - 14, "rgba(207,201,228,.8)", 11, "center");
      const lap = Math.floor(s), u = s % 1, mirrored = flip && lap % 2 === 1, fx = x0 + 20 + u * (bw - 40), fy = y0 + bh * (mirrored ? .68 : .32);
      ctx.save(); ctx.translate(fx, fy); if (mirrored) ctx.scale(1, -1);
      arrow(0, 0, 26, 0, COL.gold, 2.2, 8); arrow(0, 0, 0, -26, COL.gold, 2.2, 8); ctx.strokeStyle = COL.green; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(0, 0, 13, -.2, -1.35, true); ctx.stroke(); ctx.restore();
      text(mirrored ? "after one trip: mirrored!" : lap ? "after one trip: the same" : "", cx, y0 + bh + 18, mirrored ? COL.red : COL.green, 11, "center");
    });
    const chainY = H * .82; serif("the ladder", W / 2, chainY - 26, "rgba(245,196,81,.9)", 15, "center");
    const steps = ["∅", "set", "topological space", "Hausdorff", "2nd countable", "topological manifold", "smooth manifold", "Riemannian manifold", "+ orientation → volume"];
    ctx.font = "11px 'IBM Plex Mono', monospace"; const widths = steps.map(s2 => ctx.measureText(s2).width + 18), total = widths.reduce((a, b) => a + b, 0), sc = Math.min(1, (W - 20) / total);
    let x = (W - total * sc) / 2; steps.forEach((s2, i) => { const w = widths[i] * sc; ctx.fillStyle = i >= 5 ? "rgba(245,196,81,.16)" : "rgba(255,255,255,.05)"; ctx.strokeStyle = i >= 5 ? "rgba(245,196,81,.6)" : "rgba(255,255,255,.2)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.roundRect(x + 2, chainY - 11, w - 6, 22, 11); ctx.fill(); ctx.stroke(); text(s2, x + w / 2 - 2, chainY + 1, "#e8e4f4", 10.5 * sc + .5, "center"); if (i < steps.length - 1) text("→", x + w - 3, chainY + 1, "rgba(207,201,228,.6)", 10, "center"); x += w; });
    read(`cylinder: the frame returns unchanged — <span class="t">orientable</span>   Möbius band: it returns reflected — <span class="r">not orientable</span>\n<span class="d">the gold arrows are a basis of the tangent plane, the green arc its sense of rotation</span>`);
  }
});

/* ================================================================ UI */
let cur = 0, fadeT = 0;
const rungsEl = $("#rungs");
RUNGS.forEach((R, i) => { const b = document.createElement("button"); b.className = "rung" + ([8, 9, 11].includes(i) ? " milestone" : ""); b.textContent = R.chip; b.onclick = () => go(i); rungsEl.appendChild(b); });
function go(i) {
  i = clamp(i, 0, RUNGS.length - 1); if (RUNGS[cur] && RUNGS[cur].leave && i !== cur) RUNGS[cur].leave();
  cur = i; const R = RUNGS[i]; fadeT = performance.now();
  rungsEl.querySelectorAll(".rung").forEach((b, j) => { b.classList.toggle("on", j === i); b.classList.toggle("done", j < i); });
  const ctl = $("#ctl"); ctl.innerHTML = R.controls || ""; if (R.wire) R.wire.call(R, ctl);
  $("#card").innerHTML = `<div class="card"><div class="kick">${R.kick}</div><h2>${R.title}</h2><p class="lead">${R.lead}</p>
    <div class="grid"><div class="box def"><h3>Definition — what is added</h3>${R.def}</div><div class="box"><h3>What you can now ask</h3>${R.ask}</div><div class="box"><h3>Examples & non-examples</h3>${R.ex}</div></div></div>`;
  $("#prev").disabled = i === 0; $("#next").textContent = i === RUNGS.length - 1 ? "the ladder is complete ✓" : "add the next structure →"; $("#next").disabled = i === RUNGS.length - 1;
  $("#gloss").innerHTML = `<h2>Everything defined so far</h2><p class="sub">Each rung's definitions, in the order they were built. Rung ${i} is highlighted.</p>` +
    RUNGS.slice(0, i + 1).map((r, j) => `<section class="${j === i ? "cur" : ""}"><h4>${r.chip}</h4><dl>${r.gloss.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></section>`).join("");
  read(""); if (R.enter) R.enter.call(R);
}
$("#prev").onclick = () => go(cur - 1); $("#next").onclick = () => go(cur + 1);
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener("pointerdown", e => { const R = RUNGS[cur]; if (R.down) { R.down.call(R, ...pos(e)); try { cv.setPointerCapture(e.pointerId); } catch (_) {} } });
cv.addEventListener("pointermove", e => { const R = RUNGS[cur]; if (R.move) R.move.call(R, ...pos(e), e.buttons); });
cv.addEventListener("pointerup", () => { const R = RUNGS[cur]; if (R.up) R.up.call(R); });
cv.addEventListener("pointerleave", () => { if (cur === 4) r4probe = null; });
function loop(t) { ctx.clearRect(0, 0, W, H); ctx.globalAlpha = clamp((t - fadeT) / 380, 0, 1); try { RUNGS[cur].draw.call(RUNGS[cur], t); } catch (err) { console.error(err); } ctx.globalAlpha = 1; requestAnimationFrame(loop); }
resize(); go(0); requestAnimationFrame(loop);
</script>
</body>
