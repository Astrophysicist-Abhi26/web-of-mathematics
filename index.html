<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Web of Mathematics — Babylon to the Frontier</title>
<meta name="description" content="An interactive deep-space map of mathematics: 8 domains, their fields and topics, the bridges between them, the people who built them, and playable atoms — from Babylonian tablets to the proofs of today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>
<div id="frost"></div>

<header>
  <h1>The Web of <em>Mathematics</em></h1>
  <span id="era-label"></span>
  <button id="back-btn">← back to the cosmos</button>
</header>

<div id="legend">
  <b>status weather</b><br>
  🏛 foundational &nbsp; 🔥 frontier<br>
  ⚙️ workhorse &nbsp;&nbsp; 🪦 closed<br>
  🧟 revived<br>
  <b>— gold</b> bridges · <b style="color:#ff5d6c">— red</b> disputes
</div>

<div id="sky">
  <svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"
       aria-label="Interactive map of mathematics"></svg>
</div>

<aside id="panel" aria-live="polite">
  <button id="panel-close" aria-label="Close panel">✕</button>
  <div id="panel-body"></div>
</aside>

<div id="toggles">
  <button id="toggle-people">✦ pioneers</button>
  <button id="toggle-shells" class="on">◎ number shells</button>
  <button id="toggle-atoms">⚛ playable atoms</button>
  <button id="toggle-search">⌕ search the map</button>
</div>

<div id="atoms" hidden>
  <div id="atoms-box">
    <button id="atoms-close" aria-label="Close atoms">✕</button>
    <nav class="atom-tabs"></nav>
    <div id="atoms-box-footer">
      <button id="atoms-close-text">✕ Close</button>
    </div>
  </div>
</div>

<div id="timebar">
  <button id="play-btn" aria-label="Play through history">▶</button>
  <div class="slider-wrap">
    <div class="tl-stars"></div>
    <input type="range" id="year-slider" min="0" max="1000" value="1000" step="1"
           aria-label="Time scrubber, 1800 BCE to 2026">
  </div>
  <div id="year-readout">2026</div>
</div>

<script src="data.js"></script>
<script src="topics-data.js"></script>
<script src="pioneers-data.js"></script>
<script src="portraits/credits.js"></script>
<script src="app.js"></script>
<script src="crack.js"></script>
<script src="emblems.js"></script>
<script src="pioneers.js"></script>
<script src="atoms.js"></script>
<script src="atoms-foundations.js"></script>
<script src="atoms-algebra.js"></script>
<script src="atoms-analysis.js"></script>
<script src="atoms-number.js"></script>
<script src="atoms-discrete.js"></script>
<script src="atoms-probability.js"></script>
<script src="knot-engine.js"></script>
<script src="atoms-knots.js"></script>
<script src="atoms-puzzles.js"></script>
<script src="atoms-geometry.js"></script>
<script src="atoms-calculus.js"></script>
<script src="guide-kit.js"></script>
<script src="guides/foundations.js"></script>
<script src="guides/algebra.js"></script>
<script src="guides/analysis.js"></script>
<script src="guides/geometry.js"></script>
<script src="guides/number.js"></script>
<script src="guides/discrete.js"></script>
<script src="guides/probability.js"></script>
<script src="guides/order.js"></script>
<script src="extras.js"></script>
<script src="search.js"></script>
</body>
</html>
